issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

# The redirect URI points at the Vite dev server, which proxies /auth to the Rust server.
staticClients:
  - id: baby-greens
    name: baby-greens
    secret: dev-client-secret
    redirectURIs:
      - http://localhost:5173/auth/callback

enablePasswordDB: true

staticPasswords:
  - email: grower@example.com
    # bcrypt of "password"
    hash: "$2b$10$7xvKZCvWEbJyU9sUB5kfm.bpCPpn62otkzIVOW2JvDatFZauOzfWy"
    username: grower
    userID: 6f1c2a8e-3b7d-4d2a-9c41-1f5e8b0a7d32
  - email: second@example.com
    hash: "$2b$10$7xvKZCvWEbJyU9sUB5kfm.bpCPpn62otkzIVOW2JvDatFZauOzfWy"
