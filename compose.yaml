# Development services. Run the server and the Vite dev server on the host.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: baby_greens
      POSTGRES_PASSWORD: baby_greens
      POSTGRES_DB: baby_greens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "baby_greens"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Stand-in OIDC provider. Log in as grower@example.com with the password "password".
  # The issuer and redirect URI follow OIDC_ISSUER_URL and PUBLIC_URL from .env, which tailnet
  # mode overrides. DEX_BIND picks the address the port listens on.
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml.tpl"]
    environment:
      DEX_ISSUER: ${OIDC_ISSUER_URL:-http://localhost:5556/dex}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
    ports:
      - "${DEX_BIND:-127.0.0.1}:5556:5556"
    volumes:
      - ./dev/dex.yaml.tpl:/etc/dex/config.yaml.tpl:ro,z

volumes:
  postgres-data:
